<!-- Search Interface Component Library (Tailwind CSS) -->

<div class="w-full space-y-4">
  <!-- Search Input Bar -->
  <div class="relative flex items-center bg-ght-surface border border-ght-border rounded-full pl-5 pr-1.5 py-1.5 focus-within:bg-white focus-within:border-ght-primary transition-all shadow-sm max-w-xl">
    <iconify-icon icon="solar:magnifer-linear" class="text-ght-muted text-lg mr-3 shrink-0"></iconify-icon>
    <input type="text" id="ght-product-search" placeholder="Search for rice, beans, oil, spices..." class="w-full bg-transparent text-sm outline-none text-ght-dark placeholder:text-ght-muted font-medium h-8">
    <button class="bg-ght-accent text-white px-5 h-8 rounded-full text-xs font-bold hover:bg-orange-600 transition-colors shrink-0 shadow-sm">
      Search
    </button>
  </div>
</div>
