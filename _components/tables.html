<!-- Tables Component Library (Tailwind CSS) -->

<!-- Responsive Pricing Tiers / Grid Details Table -->
<div class="w-full overflow-hidden border border-ght-border rounded-xl shadow-sm bg-white">
  <table class="w-full text-left border-collapse text-xs">
    <thead>
      <tr class="bg-ght-surface text-ght-muted font-bold border-b border-ght-border">
        <th class="px-4 py-3 uppercase tracking-wider">Tier Quantity</th>
        <th class="px-4 py-3 uppercase tracking-wider text-right">Price Per Unit</th>
      </tr>
    </thead>
    <tbody class="divide-y divide-ght-border text-ght-dark font-semibold">
      <tr>
        <td class="px-4 py-3">5 - 9 units</td>
        <td class="px-4 py-3 text-right text-ght-accent">₦63,000</td>
      </tr>
      <tr>
        <td class="px-4 py-3">10+ units</td>
        <td class="px-4 py-3 text-right text-ght-accent">₦61,000</td>
      </tr>
    </tbody>
  </table>
</div>
