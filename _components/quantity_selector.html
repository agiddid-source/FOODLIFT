<!-- Quantity Selector Component Library (Tailwind CSS) -->

<div id="ght-whole-qty-container" class="flex items-center justify-between bg-white border border-ght-border p-3 rounded-2xl shadow-sm max-w-xs">
  <span class="text-xs font-bold text-ght-dark pl-2">Quantity</span>
  <div class="flex items-center gap-4">
    <button id="ght-qty-minus" class="w-8 h-8 rounded-full bg-ght-surface text-ght-dark hover:bg-slate-200 transition-colors flex items-center justify-center font-bold">-</button>
    <span id="ght-qty-val" class="font-bold text-sm w-4 text-center">1</span>
    <button id="ght-qty-plus" class="w-8 h-8 rounded-full bg-ght-surface text-ght-dark hover:bg-slate-200 transition-colors flex items-center justify-center font-bold">+</button>
  </div>
</div>
