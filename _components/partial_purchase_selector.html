<!-- Partial Purchase Selector Component Library (Tailwind CSS) -->

<div id="ght-partial-qty-container" class="space-y-2 max-w-sm">
  <span class="text-[10px] font-bold text-ght-dark uppercase tracking-widest block">Select Fraction</span>
  
  <div id="ght-partial-presets" class="flex flex-wrap gap-2">
    <!-- Active Preset -->
    <button class="ght-btn-partial py-2 px-3 text-xs font-bold rounded-lg border border-ght-primary bg-ght-primary/10 text-ght-primary transition-all">
      Half Bag (25kg)
    </button>
    <!-- Inactive Preset -->
    <button class="ght-btn-partial py-2 px-3 text-xs font-bold rounded-lg border border-ght-border bg-white text-ght-muted hover:text-ght-dark transition-all">
      Paint Bucket (approx. 4kg)
    </button>
  </div>
</div>
