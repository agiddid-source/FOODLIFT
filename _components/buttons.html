<!-- Buttons Component Library (Tailwind CSS) -->

<!-- Primary Button -->
<button class="bg-ght-accent text-white px-8 py-3.5 rounded-xl text-sm font-bold shadow-md hover:bg-orange-600 transition-colors flex items-center justify-center gap-2">
  <span>Primary Action</span>
</button>

<!-- Secondary / Pill Button -->
<button class="bg-ght-dark text-white hover:bg-black rounded-xl font-bold text-sm px-8 py-3.5 shadow-md transition-all flex items-center gap-2">
  <iconify-icon icon="solar:cart-plus-bold" class="text-lg"></iconify-icon>
  <span>Add to Cart</span>
</button>

<!-- Outline Button -->
<button class="bg-white border border-ght-border text-ght-accent hover:bg-ght-accent hover:text-white hover:border-ght-accent rounded-lg flex items-center justify-center px-4 py-1.5 text-[11px] font-bold transition-colors shadow-sm">
  <span>+ Add</span>
</button>

<!-- Light Button -->
<button class="bg-ght-surface text-ght-dark border border-ght-border hover:bg-slate-200 transition-colors px-6 py-2.5 rounded-xl font-bold text-xs">
  <span>Secondary Button</span>
</button>

<!-- Icon Only Round Button -->
<button class="text-ght-muted hover:text-ght-dark bg-white border border-ght-border w-8 h-8 flex items-center justify-center rounded-full transition-all shadow-sm">
  <iconify-icon icon="solar:close-linear" class="text-lg"></iconify-icon>
</button>
