<!-- Modals Component Library (Tailwind CSS + JS integration hook) -->

<!-- Modal Container (Hidden by default, remove 'hidden' class to open) -->
<div id="example-modal" class="fixed inset-0 z-50 flex items-center justify-center hidden" role="dialog" aria-modal="true">
  <!-- Backdrop Blur -->
  <div class="absolute inset-0 bg-black/40 backdrop-blur-sm"></div>
  
  <!-- Modal Box Content -->
  <div class="relative bg-white w-full max-w-md mx-4 rounded-[24px] shadow-2xl p-8 border border-ght-border z-10 animate-fade-in">
    <!-- Header -->
    <div class="flex items-center justify-between mb-4">
      <h3 class="font-bold text-xl tracking-tight text-ght-dark">Modal Title</h3>
      <button class="text-ght-muted hover:text-ght-dark bg-ght-surface w-8 h-8 flex items-center justify-center rounded-full transition-all border border-ght-border shadow-sm">
        <iconify-icon icon="solar:close-linear" class="text-lg"></iconify-icon>
      </button>
    </div>
    
    <!-- Body -->
    <div class="text-sm font-medium text-ght-muted mb-6">
      This is the body content of the modal. Add forms, details, or steps here.
    </div>
    
    <!-- Actions -->
    <div class="flex items-center gap-3">
      <button class="flex-1 bg-ght-surface text-ght-dark border border-ght-border py-2.5 rounded-xl text-xs font-bold transition-all">Cancel</button>
      <button class="flex-1 bg-ght-accent text-white py-2.5 rounded-xl text-xs font-bold hover:bg-orange-600 transition-all shadow-md">Confirm</button>
    </div>
  </div>
</div>
