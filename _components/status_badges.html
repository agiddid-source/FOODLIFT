<!-- Status Badges Component Library (Tailwind CSS) -->

<!-- Success / In Transit / On the Way Badge -->
<span class="bg-green-100 text-green-700 text-[9px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wider">
  On the way
</span>

<!-- Warning / Pending / In Review Badge -->
<span class="bg-yellow-100 text-yellow-700 text-[9px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wider">
  Pending
</span>

<!-- Danger / Out of Stock / Cancelled Badge -->
<span class="bg-red-100 text-red-700 text-[9px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wider">
  Out of Stock
</span>

<!-- Accent / Promo Discount Badge -->
<span class="bg-red-50 text-red-600 text-[8px] font-bold px-1.5 py-0.5 rounded uppercase tracking-wider">
  12% OFF
</span>
