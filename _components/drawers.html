<!-- Drawers Component Library (Tailwind CSS + JS slide transitions) -->

<!-- Right Slide-In Drawer (Hidden by default, remove 'hidden' class to toggle) -->
<div id="example-drawer" class="fixed inset-0 z-50 flex justify-end hidden" role="dialog" aria-modal="true">
  <!-- Backdrop Blur with Opacity Animation Trigger -->
  <div id="example-drawer-backdrop" class="absolute inset-0 bg-black/40 backdrop-blur-sm opacity-0 transition-opacity duration-300"></div>
  
  <!-- Drawer Panel Content with Translate-X Slide Animation -->
  <div id="example-drawer-panel" class="relative bg-white w-full max-w-md h-full shadow-2xl p-6 flex flex-col justify-between z-10 transform translate-x-full transition-transform duration-300">
    <div>
      <!-- Header -->
      <div class="flex items-center justify-between border-b border-ght-border pb-4 mb-4">
        <h3 class="font-bold text-lg text-ght-dark">Drawer Header</h3>
        <button id="example-drawer-close" class="text-ght-muted hover:text-ght-dark bg-ght-surface border border-ght-border w-8 h-8 flex items-center justify-center rounded-full transition-all">
          <iconify-icon icon="solar:close-linear" class="text-lg"></iconify-icon>
        </button>
      </div>
      
      <!-- Body Area -->
      <div class="space-y-4">
        <p class="text-sm text-ght-muted">Slide-in content drawer template. Fits cart details, mobile navigations, filters, etc.</p>
      </div>
    </div>
    
    <!-- Footer Section -->
    <div class="border-t border-ght-border pt-4">
      <button class="w-full bg-ght-dark text-white hover:bg-black py-3.5 rounded-xl font-bold text-sm shadow-md transition-all">
        Proceed Action
      </button>
    </div>
  </div>
</div>
