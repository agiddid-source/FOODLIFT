<!-- Sidebar / Right Column Widgets Component Library (Tailwind CSS) -->

<!-- Responsive Aside Sidebar Container -->
<aside class="lg:col-span-3 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-1 gap-6 h-fit">
  
  <!-- My Wallet Widget -->
  <div class="bg-ght-dark rounded-[24px] p-7 text-white shadow-xl relative overflow-hidden">
    <div class="absolute -top-12 -right-12 w-32 h-32 bg-ght-accent rounded-full blur-[40px] opacity-20 pointer-events-none"></div>
    <div class="relative z-10 flex items-center justify-between mb-6">
      <div class="flex items-center gap-2 text-white/70">
        <iconify-icon icon="solar:wallet-bold" class="text-lg"></iconify-icon>
        <h3 class="font-bold text-sm tracking-widest uppercase text-[10px]">My Wallet</h3>
      </div>
      <button class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center hover:bg-white/20 transition-colors">
        <iconify-icon icon="solar:menu-dots-bold"></iconify-icon>
      </button>
    </div>
    <div class="relative z-10 mb-6">
      <span class="text-[11px] text-white/50 font-medium block mb-1">Available Balance</span>
      <span class="text-3xl font-bold tracking-tight">₦125,000</span>
    </div>
    <button id="ght-action-fund-widget" class="relative z-10 w-full bg-ght-accent text-white hover:bg-orange-600 py-3 rounded-xl font-bold text-sm shadow-lg transition-all flex items-center justify-center gap-2">
      <iconify-icon icon="solar:add-circle-bold" class="text-lg"></iconify-icon>
      <span>Top up wallet</span>
    </button>
  </div>

  <!-- Active Order Tracker Widget -->
  <div class="bg-white border border-ght-border p-6 rounded-[24px] shadow-sm">
    <div class="flex justify-between items-center mb-5">
      <h3 class="font-bold text-sm text-ght-dark tracking-tight">Active Order</h3>
      <a href="#" class="text-[10px] font-bold uppercase tracking-widest text-ght-accent hover:underline">View All</a>
    </div>
    <div class="bg-ght-surface rounded-2xl p-5 space-y-4">
      <div class="flex justify-between items-start">
        <div>
          <span class="text-[9px] text-ght-muted font-bold uppercase tracking-widest block mb-0.5">#SB-2505012</span>
          <span class="text-xs font-bold text-ght-dark">Wholesale Restock</span>
        </div>
        <span class="bg-green-100 text-green-700 text-[9px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wider">On the way</span>
      </div>
      <div class="pt-1">
        <span class="text-[10px] text-ght-muted font-medium block mb-0.5">Estimated delivery</span>
        <div class="flex items-baseline gap-1">
          <span class="text-2xl font-bold tracking-tight text-ght-dark">18</span>
          <span class="text-xs font-bold text-ght-muted">mins</span>
        </div>
      </div>
      <div class="relative pt-3 pb-1">
        <div class="h-1.5 w-full bg-white rounded-full overflow-hidden">
          <div class="h-full bg-ght-primary w-2/3 rounded-full relative">
            <div class="absolute right-0 top-1/2 -translate-y-1/2 w-2.5 h-2.5 bg-white rounded-full border-2 border-ght-primary shadow-sm"></div>
          </div>
        </div>
        <div class="flex justify-between text-[8px] font-bold text-ght-muted uppercase mt-2">
          <span>Warehouse</span>
          <span class="text-ght-primary">In Transit</span>
          <span>Delivered</span>
        </div>
      </div>
    </div>
    <button id="ght-action-track" class="w-full mt-4 py-2.5 bg-white text-ght-dark font-bold text-xs rounded-xl hover:bg-ght-surface transition-colors border border-ght-border shadow-sm">
      Track Live Status
    </button>
  </div>

</aside>
