<!-- Selects Component Library (Tailwind CSS) -->

<!-- Segmented Controls / Pill Toggle -->
<div class="flex gap-2 p-1 bg-ght-surface border border-ght-border rounded-xl">
  <button class="flex-1 py-2 text-xs font-bold rounded-lg bg-white shadow-sm text-ght-dark border border-ght-border transition-all">
    Option A (Active)
  </button>
  <button class="flex-1 py-2 text-xs font-bold rounded-lg text-ght-muted hover:text-ght-dark transition-all">
    Option B (Inactive)
  </button>
</div>

<!-- Basic Dropdown / Custom Dropdown Wrapper -->
<div class="relative w-full">
  <select class="w-full bg-white border border-ght-border rounded-xl px-4 py-3 text-sm font-semibold text-ght-dark outline-none focus:border-ght-primary appearance-none cursor-pointer">
    <option value="1">Option 1</option>
    <option value="2">Option 2</option>
    <option value="3">Option 3</option>
  </select>
  <div class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-ght-muted">
    <iconify-icon icon="solar:alt-arrow-down-linear" class="text-xs"></iconify-icon>
  </div>
</div>
