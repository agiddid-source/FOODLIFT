<!-- Product Details Modal Component Library (Tailwind CSS) -->

<div id="ght-product-modal" class="fixed inset-0 z-50 flex items-center justify-center" role="dialog" aria-modal="true">
  <!-- Backdrop -->
  <div id="ght-pm-backdrop" class="absolute inset-0 bg-black/40 backdrop-blur-sm"></div>
  
  <!-- Content Panel -->
  <div class="relative bg-white w-full max-w-3xl mx-4 rounded-[24px] shadow-2xl overflow-hidden flex flex-col max-h-[90vh] z-10 border border-ght-border animate-fade-in">
    <!-- Header -->
    <div class="h-14 border-b border-ght-border flex items-center justify-between px-6 bg-ght-background shrink-0">
      <span class="font-bold text-xs uppercase tracking-widest text-ght-dark">Wholesale Details</span>
      <button id="ght-pm-close" class="text-ght-muted hover:text-ght-dark bg-white border border-ght-border w-8 h-8 flex items-center justify-center rounded-full transition-all shadow-sm">
        <iconify-icon icon="solar:close-linear" class="text-lg"></iconify-icon>
      </button>
    </div>

    <!-- Body Scrollable Content -->
    <div class="overflow-y-auto p-6 md:p-8 flex flex-col md:flex-row gap-8">
      <!-- Left: Image Section -->
      <div class="w-full md:w-1/2 flex flex-col gap-4">
        <div class="aspect-square w-full rounded-2xl overflow-hidden border border-ght-border bg-ght-surface relative">
          <img id="ght-pm-image" src="assets/img/rices (1).jpg" alt="Product Image" class="w-full h-full object-cover">
        </div>
      </div>

      <!-- Right: Product Details Info -->
      <div class="flex-1 space-y-6">
        <div>
          <span id="ght-pm-category" class="text-[9px] font-bold tracking-widest uppercase text-ght-primary bg-green-50 px-2 py-1 rounded border border-green-100">Grains & Rice</span>
          <h2 id="ght-pm-name" class="text-2xl font-bold tracking-tight text-ght-dark mt-3 leading-tight">Premium Local Rice</h2>
          <div class="flex items-center gap-3 mt-2">
            <div class="flex items-center gap-1 text-[11px] text-yellow-500 font-bold">
              <iconify-icon icon="solar:star-bold"></iconify-icon>
              <span id="ght-pm-rating" class="text-ght-dark">4.8</span>
            </div>
            <div class="w-1 h-1 rounded-full bg-ght-border"></div>
            <span id="ght-pm-stock-badge" class="text-green-700 font-bold text-[11px]">In Stock</span>
          </div>
        </div>

        <p id="ght-pm-desc" class="text-[13px] text-ght-muted font-medium leading-relaxed">Detailed descriptions go here.</p>

        <!-- Base Price Block -->
        <div class="bg-ght-surface border border-ght-border rounded-2xl p-5 flex items-center justify-between">
          <div>
            <span class="text-[10px] font-bold text-ght-muted uppercase tracking-widest block mb-1">Base Price</span>
            <div class="flex items-end gap-1">
              <span id="ght-pm-price" class="text-2xl font-bold text-ght-dark tracking-tight">₦65,000</span>
              <span id="ght-pm-unit" class="text-xs font-bold text-ght-muted pb-1">/ 50kg Bag</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
