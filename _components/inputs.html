<!-- Inputs Component Library (Tailwind CSS) -->

<!-- Search Input with Icon and Inner Action Button -->
<div class="w-full relative flex items-center bg-ght-surface border border-ght-border rounded-full pl-5 pr-1.5 py-1.5 focus-within:bg-white focus-within:border-ght-primary transition-all shadow-sm">
  <iconify-icon icon="solar:magnifer-linear" class="text-ght-muted text-lg mr-3 shrink-0"></iconify-icon>
  <input type="text" placeholder="Search for groceries..." class="w-full bg-transparent text-sm outline-none text-ght-dark placeholder:text-ght-muted font-medium h-8">
  <button class="bg-ght-accent text-white px-5 h-8 rounded-full text-xs font-bold hover:bg-orange-600 transition-colors shrink-0 shadow-sm">
    Search
  </button>
</div>

<!-- Basic Text Input -->
<div class="flex flex-col gap-1.5">
  <label class="text-[10px] font-bold text-ght-muted uppercase tracking-wider">Product Name</label>
  <input type="text" placeholder="Enter name" class="w-full bg-white border border-ght-border rounded-xl px-4 py-3 text-sm font-medium outline-none focus:border-ght-primary transition-colors">
</div>
