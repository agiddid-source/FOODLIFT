<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Categories - FoodLift Wholesale</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
  <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/globals.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <style>
    body { font-family: 'DM Sans', sans-serif; background: var(--ght-color-background); color: var(--ght-color-dark); }
    .category-card { border-radius: 16px; }
    .category-card:hover { transform: translateY(-2px); box-shadow: var(--ght-shadow-card); }
    .stat-tile { background: #fff; border: 1px solid var(--ght-color-border); border-radius: 16px; padding: 16px; }
  </style>
</head>
<body class="min-h-screen antialiased">
  <header class="bg-white border-b border-ght-border sticky top-0 z-40">
    <div class="max-w-[1440px] mx-auto px-4 md:px-6 h-16 flex items-center justify-between gap-4">
      <a href="index.html" class="flex items-center gap-2.5 shrink-0">
        <img src="assets/logo.png" alt="FoodLift Logo" class="h-10 object-contain">
        <div class="hidden sm:block border-l border-ght-border pl-3">
          <span class="font-bold text-sm block leading-none">FoodLift</span>
          <span class="text-[9px] text-ght-muted font-bold uppercase tracking-widest">Wholesale</span>
        </div>
      </a>
      <nav class="flex items-center gap-4 text-sm font-bold">
        <a href="ProductList.html" class="text-ght-muted hover:text-ght-dark">Products</a>
        <a href="categories.html" class="text-ght-dark">Categories</a>
      </nav>
    </div>
  </header>

  <main class="max-w-[1440px] mx-auto px-4 md:px-6 py-6 md:py-8">
    <section class="flex flex-col md:flex-row md:items-end justify-between gap-4 mb-5">
      <div>
        <nav class="flex items-center gap-2 text-[11px] font-bold text-ght-muted uppercase tracking-wider mb-3">
          <a href="index.html" class="hover:text-ght-dark">Home</a>
          <iconify-icon icon="solar:alt-arrow-right-linear" class="text-[10px]"></iconify-icon>
          <span class="text-ght-dark">Categories</span>
        </nav>
        <h1 class="text-3xl md:text-4xl font-bold tracking-tight">Shop by category</h1>
        <p class="text-sm text-ght-muted font-medium mt-2 max-w-xl">Browse every wholesale category, preview products, and jump into the full catalog with the right filter applied.</p>
      </div>
      <a href="ProductList.html" class="ght-btn ght-btn-secondary rounded-xl text-sm px-4 py-2">View all products</a>
    </section>

    <section id="category-stats" class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6"></section>

    <section id="category-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4 md:gap-5"></section>
  </main>

  <script src="js/customer/catalog-utils.js"></script>
  <script>
    const grid = document.getElementById('category-grid');
    const stats = document.getElementById('category-stats');

    function renderProductPreview(product) {
      return `
        <a href="${FoodLiftCatalog.productUrl(product)}" class="flex items-center gap-3 rounded-xl border border-ght-border bg-ght-surface/60 p-2.5 hover:bg-white transition-colors">
          <img src="${product.image || FoodLiftCatalog.fallbackImage}" alt="${product.name}" class="w-12 h-12 rounded-lg object-cover bg-white" onerror="FoodLiftCatalog.safeImage(event)">
          <div class="min-w-0 flex-1">
            <p class="text-sm font-bold text-ght-dark truncate">${product.name}</p>
            <p class="text-xs text-ght-muted font-medium">${FoodLiftCatalog.money(product.price_per_unit)} / ${product.unit}</p>
          </div>
          <iconify-icon icon="solar:alt-arrow-right-linear" class="text-ght-muted"></iconify-icon>
        </a>
      `;
    }

    function renderCategoryCard(category) {
      const products = category.products;
      return `
        <article class="category-card bg-white border border-ght-border p-4 md:p-5 transition-all">
          <div class="flex items-start justify-between gap-4 mb-4">
            <div class="flex items-center gap-3 min-w-0">
              <img src="${category.image}" alt="${category.name}" class="w-14 h-14 rounded-xl object-cover bg-ght-surface" onerror="FoodLiftCatalog.safeImage(event)">
              <div class="min-w-0">
                <h2 class="text-lg font-bold truncate">${category.name}</h2>
                <p class="text-xs text-ght-muted font-bold uppercase tracking-wider">${products.length} products</p>
              </div>
            </div>
            <a href="${FoodLiftCatalog.categoryUrl(category.name)}" class="ght-btn ght-btn-secondary rounded-xl text-xs px-3 py-2 shrink-0">Open</a>
          </div>
          <div class="space-y-2">
            ${products.slice(0, 4).map(renderProductPreview).join('')}
          </div>
        </article>
      `;
    }

    async function initCategoriesPage() {
      try {
        const products = await FoodLiftCatalog.getProducts();
        const categories = FoodLiftCatalog.getCategories(products);
        const stocked = products.filter(product => product.stock > 0).length;
        stats.innerHTML = [
          ['Categories', categories.length],
          ['Products', products.length],
          ['In stock', stocked],
          ['Partial packs', products.filter(product => product.supports_partial).length]
        ].map(([label, value]) => `
          <div class="stat-tile">
            <p class="text-2xl font-bold text-ght-dark">${value}</p>
            <p class="text-[10px] font-bold text-ght-muted uppercase tracking-wider mt-1">${label}</p>
          </div>
        `).join('');
        grid.innerHTML = categories.map(renderCategoryCard).join('');
      } catch (error) {
        grid.innerHTML = '<div class="col-span-full bg-white border border-ght-border rounded-2xl p-6 text-sm font-bold text-ght-dark">Unable to load categories. Please refresh the page.</div>';
        console.error(error);
      }
    }

    initCategoriesPage();
  </script>
</body>
</html>
