<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FoodLift | Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="css/dashboard.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>body{font-family:"DM Sans",sans-serif;}</style>
</head>
<body class="dashboard-body">

<div class="dash-shell">

  <!-- SIDEBAR + BACKDROP + BOTTOM TAB BAR — injected by load-static.js from _components/sidebar.html -->
  <div id="navPlaceholder"></div>

  <!-- MAIN -->
  <div class="dash-main">

    <!-- HEADER — injected by load-static.js from _components/header.html -->
    <header></header>

    <!-- CONTENT -->
    <main class="dash-content">

      <!-- HERO — stays static; it's page chrome, not a swappable module -->
      <section class="dash-hero">
        <div>
          <h2>Welcome back, User!</h2>
          <p>Receive incoming orders, verify item availability, reserve inventory instantly, and coordinate seamless rider handoffs to keep every shipment moving efficiently.</p>
        </div>
        <a href="#" data-module="orders" class="dash-hero-cta">
          View Pending Orders
          <i class="fa-solid fa-arrow-right"></i>
        </a>
      </section>

      <!-- MODULE CONTENT — filled by dashboard.js's loadModule(), fed by pages/*.html fragments -->
      <section
        id="moduleContent"
        class="bg-[#F4F4F4] rounded-[28px] border border-[rgba(0,0,0,0.08)] mt-10 min-h-[600px] p-10">
      </section>

    </main>
  </div>
</div>

<script src="js/load-static.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
